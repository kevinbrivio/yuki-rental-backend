services:
  postgres:
    image: postgres:17-alpine
    container_name: yuki-postgres
    environment:
      POSTGRES_USER: yuki
      POSTGRES_DB: yuki_rental
      POSTGRES_PASSWORD: yuki_secret
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuki -d yuki_rental"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
